<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For You</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08050a;color:#fff;font-family:ui-monospace,Consolas,monospace}
canvas{display:block;width:100vw;height:100vh}
.hint{position:fixed;bottom:24px;left:0;right:0;text-align:center;color:#d7b9d0;font-size:12px;letter-spacing:.14em;opacity:.75;pointer-events:none}
.replay{position:fixed;right:18px;bottom:18px;border:1px solid #b77a9b;background:#190d18;color:#f8d9e9;border-radius:30px;padding:10px 16px;font:inherit;font-size:12px;cursor:pointer;opacity:0;transition:opacity .5s}
.replay.show{opacity:1}.replay:hover{background:#32172b}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hint" id="hint">UNE PETITE SURPRISE…</div>
<button class="replay" id="replay">↻ Revoir</button>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
let W,H,D,t0=performance.now(),last=0,particles=[],embers=[],stars=[],done=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.4,1.5),p:rand(0,6.28)}))}
addEventListener('resize',resize);resize();
function heart(x,y,s,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,.3);ctx.bezierCurveTo(-1.3,-.5,-.8,-1.25,0,-.55);ctx.bezierCurveTo(.8,-1.25,1.3,-.5,0,.3);ctx.fillStyle=color;ctx.fill();ctx.restore()}
function reset(){t0=performance.now();last=0;particles=[];embers=[];done=false;document.querySelector('#replay').classList.remove('show');document.querySelector('#hint').textContent='UNE PETITE SURPRISE…'}
document.querySelector('#replay').onclick=reset;
function drawEnvelope(p){
 const ew=Math.min(W*.62,520),eh=ew*.62,x=(W-ew)/2,y=H*.48-eh/2;
 ctx.save();ctx.globalAlpha=p;ctx.shadowColor='#e3a6b9';ctx.shadowBlur=24;
 // envelope body
 ctx.fillStyle='#b88758';ctx.beginPath();ctx.roundRect(x,y,ew,eh,7);ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#e5c69b';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#d3a875';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(W/2,y+eh*.52);ctx.lineTo(x+ew,y);ctx.closePath();ctx.fill();
 ctx.fillStyle='#a8784d';ctx.beginPath();ctx.moveTo(x,y+eh);ctx.lineTo(W/2,y+eh*.48);ctx.lineTo(x+ew,y+eh);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#6b4534';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(W/2,y+eh*.52);ctx.lineTo(x+ew,y);ctx.stroke();
 ctx.restore();
 return {x,y,ew,eh,cx:W/2,cy:y+eh*.5};
}
function rose(x,y,scale,progress,time){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.globalAlpha=progress;
 // stem and leaves
 ctx.strokeStyle='#397b45';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,12);ctx.quadraticCurveTo(-10,85,2,175);ctx.stroke();
 function leaf(side,yy,rot){ctx.save();ctx.translate(0,yy);ctx.rotate(rot*side);ctx.fillStyle='#28643b';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(side*45,-35,side*66,-4);ctx.quadraticCurveTo(side*35,24,0,0);ctx.fill();ctx.strokeStyle='#6eaa69';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(side*57,-4);ctx.stroke();ctx.restore()}
 leaf(-1,95,.3);leaf(1,125,.35);
 // petals, layered
 const colors=['#4c071d','#790d2b','#a3133c','#c51e4b','#e34a69','#f17b8b'];
 for(let layer=0;layer<5;layer++){
  const n=5+layer,rad=7+layer*7;
  for(let i=0;i<n;i++){
   const a=i*2*Math.PI/n+layer*.55+Math.sin(time*.6+layer)*.035;
   ctx.save();ctx.rotate(a);ctx.translate(0,-rad);
   ctx.fillStyle=colors[Math.min(5,layer+1)];ctx.beginPath();
   ctx.moveTo(0,5);ctx.bezierCurveTo(-22,-8,-20,-36,0,-31);ctx.bezierCurveTo(20,-36,22,-8,0,5);ctx.fill();
   ctx.strokeStyle='rgba(255,180,190,.22)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
  }
 }
 ctx.fillStyle='#5a0924';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function burst(x,y){for(let i=0;i<100;i++){let a=rand(-Math.PI,0),s=rand(50,280);embers.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.5,1.7),age:0,size:rand(1,3),fire:true})}}
function frame(now){
 let t=(now-t0)/1000,dt=Math.min(.04,(now-last)/1000||.016);last=now;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#08050a';ctx.fillRect(0,0,W,H);
 // ambient stars
 for(const s of stars){let a=.15+.55*(.5+.5*Math.sin(t*1.4+s.p));ctx.fillStyle=`rgba(183,197,255,${a})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
 // floating motes
 if(Math.random()<.35)particles.push({x:rand(0,W),y:H+5,vx:rand(-8,8),vy:rand(-18,-6),life:rand(4,9),age:0});
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.age+=dt;p.x+=p.vx*dt+Math.sin(t+p.y*.01)*3*dt;p.y+=p.vy*dt;if(p.age>p.life){particles.splice(i,1);continue}ctx.fillStyle=`rgba(255,190,210,${(1-p.age/p.life)*.55})`;ctx.fillRect(p.x,p.y,2,2)}
 const envIn=ease(t/1.6),cursor=ease((t-1.9)/2.2),burn=ease((t-4.67)/3.4),roseP=ease((t-7.0)/4.4),glow=ease((t-9)/4);
 if(t<10.8){
  const e=drawEnvelope(envIn*(1-burn));
  // little heart seal and cursor trail
  if(t>2){let cx=e.cx,cy=e.y+e.eh*.45;heart(cx,cy,Math.max(3,Math.min(17,envIn*17)),'#b52e68')}
  if(t>1.9&&t<4.8){let k=cursor;let x=W*(1.1-.6*k),y=H*(.05+.43*k);ctx.fillStyle='#c58bff';ctx.shadowColor='#b46cff';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+20);ctx.lineTo(x+6,y+14);ctx.lineTo(x+12,y+25);ctx.lineTo(x+16,y+23);ctx.lineTo(x+10,y+12);ctx.lineTo(x+20,y+12);ctx.closePath();ctx.fill();ctx.shadowBlur=0}
  if(t>4.67&&t<8.4&&Math.random()<.8){let x=rand(W*.2,W*.8),y=rand(H*.3,H*.75);embers.push({x,y,vx:rand(-20,20),vy:rand(-65,-15),life:rand(.4,1.2),age:0,size:rand(1,4),fire:true})}
  if(t>4.67&&t<7.9){ctx.globalAlpha=(1-burn)*.8;ctx.fillStyle='#ff692e';ctx.shadowColor='#ff4c16';ctx.shadowBlur=30;ctx.fillRect(W*.25,H*.72,W*.5,5);ctx.shadowBlur=0;ctx.globalAlpha=1}
 }
 // embers
 for(let i=embers.length-1;i>=0;i--){let p=embers[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=35*dt;if(p.age>p.life){embers.splice(i,1);continue}let a=1-p.age/p.life;ctx.globalAlpha=a;ctx.fillStyle=p.fire?'#ff9a43':'#ffb4c8';ctx.shadowColor=p.fire?'#ff4c19':'#ff9cce';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}
 if(t>7.1){
  let sc=Math.min(1,W/700,H/700)*(.85+roseP*.15);
  rose(W/2,H*.38,sc,roseP,t);
  if(glow>0){let g=ctx.createRadialGradient(W/2,H*.37,10,W/2,H*.37,Math.min(W,H)*.5);g.addColorStop(0,`rgba(90,130,255,${glow*.15})`);g.addColorStop(1,'rgba(8,5,10,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 }
 if(t>12.5){
  ctx.save();ctx.textAlign='center';ctx.globalAlpha=ease((t-12.5)/2);ctx.fillStyle='#f7d9e4';ctx.shadowColor='#d64b7b';ctx.shadowBlur=24;ctx.font=`600 ${Math.max(20,Math.min(34,W*.045))}px Georgia,serif`;ctx.fillText('For You',W/2,H*.79);ctx.font=`${Math.max(13,Math.min(17,W*.022))}px Georgia,serif`;ctx.fillStyle='#d9b5c6';ctx.fillText('Une rose, juste pour toi ♥',W/2,H*.84);ctx.restore();
 }
 if(t>15&&!done){done=true;document.querySelector('#hint').textContent='';document.querySelector('#replay').classList.add('show')}
 requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
</body></html>
